server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # не отдавать служебные/секретные файлы
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(db|sqlite|sqlite3|env|log|bak|old|orig|swp|save|tmp)$ { deny all; }
    location ~ ^/(install|\.git|node_modules|vendor)/ { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|mp3|ogg|wav)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
