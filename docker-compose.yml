# deploy-stack — единый стек: панель-менеджер + Forgejo CI/CD runner.
#
#   cd /root/deploy-stack
#   cp .env.example .env      # или сгенерируй install.sh (рандомный пароль)
#   docker compose up -d --build
#
# Панель:   http://HOST:${WEB_PORT}
# Логин:    ${DEPLOY_ADMIN_USER} / ${DEPLOY_ADMIN_PASS}
#
# Как это работает:
#  - deploy-stack (контейнер-менеджер) общается с Docker-демоном ХОСТА через
#    /var/run/docker.sock и управляет контейнерами сайтов, которые сам порождает.
#  - Состояние (data/, sites/, runners/) живёт на ХОСТЕ в ./deploy-data,
#    поэтому панель не теряет стек при пересборке.
#  - Код сайтов — в ./www (монтируется в /var/www и внутрь раннера/сайтов).
#
# Требуется Linux-хост с Docker Engine (>=20).

services:
  # ── Панель-менеджер ──
  deploy-stack:
    build: .
    image: deploy-stack:latest
    container_name: deploy-stack
    restart: unless-stopped
    entrypoint: ["/deploy/deploy"]
    command: ["serve", "--port", "3000"]
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DEPLOY_HOME: /deploy
      DEPLOY_SITES: /deploy/sites/docker-compose.yml
      DEPLOY_RUNNERS: /deploy/runners/docker-compose.yml
      RUNNER_DATA: /runner
      DEPLOY_ADMIN_USER: ${DEPLOY_ADMIN_USER:-admin}
      DEPLOY_ADMIN_PASS: ${DEPLOY_ADMIN_PASS:-admin}
      DEPLOY_GIT_URL: ${DEPLOY_GIT_URL:-http://git.example.com:3006}
      DEPLOY_RUNNER_REGTOKEN: ${DEPLOY_RUNNER_REGTOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./www:/var/www
      # ── состояние стека живёт на ХОСТЕ, а не внутри анонимного тома ──
      # ВАЖНО: sites/ и runners/ монтируются ОТДЕЛЬНО, чтобы панель и раннер
      # правили один и тот же compose. Иначе панель пишет в /deploy/sites внутри
      # своего тома, а раннер — в /root/deploy-stack/sites на хосте: получается
      # «split brain» — список сайтов в UI пустой, хотя контейнеры живы.
      - ./deploy-data:/deploy
      - ./sites:/deploy/sites
      - ./runners:/deploy/runners
      - ./data:/deploy/data
      # данные Forgejo-раннеров (labels в UI). На хосте это /root/forgejo-runner,
      # внутри — /runner (RUNNER_DATA). Директорию можно переопределить:
      #   RUNNER_DATA_HOST=/root/forgejo-runner  в .env
      - ${RUNNER_DATA_HOST:-./forgejo-runner}:/runner
      # шаблоны и статика менеджера — чтобы docker build брал их по HOST-путям
      - ./templates:/deploy/templates:ro
      - ./static:/deploy/static
    labels:
      - "deploy-stack.role=panel"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── CI/CD раннер (host-исполнитель: деплоит прямо на этом хосте) ──
  # Нужен только если используешь Forgejo/Gitea Actions.
  # Токен: админка Forgejo -> Runners. Можно оставить пустым и не включать.
  runner:
    image: data.forgejo.org/forgejo/runner:4.0.0
    container_name: deploy-stack-runner
    user: root
    restart: unless-stopped
    depends_on:
      - deploy-stack
    volumes:
      - ./runner:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./www:/var/www
      # менеджер — ради бинаря deploy и шаблонов
      - ./deploy-data:/deploy
      # тот же sites/, что у панели: раннер деплоит в общий compose
      - ./sites:/deploy/sites
      - ./data:/deploy/data
    environment:
      DEPLOY_HOME: /deploy
      DEPLOY_SITES: /deploy/sites/docker-compose.yml
    command: >
      sh -c "apk update && apk add --no-cache docker-cli docker-cli-compose rsync nodejs npm &&
             ln -sf /deploy/deploy /usr/local/bin/deploy &&
             forgejo-runner daemon --config /data/config.yaml"
    profiles: ["ci"]
