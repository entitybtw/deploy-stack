<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>deploy-stack</title>
<style>
:root{--accent:#7a9db8;--accent-glow:#1a2530;--green:#7a9;--red:#d77;--max-w:960px;--font-sans:system-ui,-apple-system,sans-serif;--font-mono:ui-monospace,Courier New,monospace}
[data-theme="dark"]{--bg-0:#0f0f0f;--bg-1:#1a1a1a;--bg-2:#222;--bg-3:#2a2a2a;--text-0:#ddd;--text-1:#999;--text-2:#666;--border-1:#2a2a2a;--border-2:#333}
[data-theme="light"]{--bg-0:#fafafa;--bg-1:#fff;--bg-2:#f5f5f5;--bg-3:#eee;--text-0:#222;--text-1:#666;--text-2:#999;--border-1:#ddd;--border-2:#ccc}
[data-theme="black"]{--bg-0:#000;--bg-1:#111;--bg-2:#1a1a1a;--bg-3:#222;--text-0:#eee;--text-1:#aaa;--text-2:#666;--border-1:#222;--border-2:#2a2a2a}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font-sans);background:var(--bg-0);color:var(--text-0);line-height:1.5}
.wrap{max-width:var(--max-w);margin:0 auto;padding:0 16px}
.nav{padding:12px 0;border-bottom:1px solid var(--border-1)}
.nav-inner{max-width:var(--max-w);margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:12px}
.logo{font-size:1rem;font-weight:700;color:var(--accent)}.logo span{color:var(--text-2);font-weight:400}
.nav-tabs{display:flex;gap:0;margin:0 auto}
.nav-tab{padding:6px 14px;font-size:.82rem;color:var(--text-1);cursor:pointer;border-bottom:2px solid transparent;font-weight:500}.nav-tab:hover{color:var(--text-0)}.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.stats{display:flex;gap:14px;font-size:.78rem;color:var(--text-2)}.stats b{color:var(--text-0)}
.card{background:var(--bg-1);border:1px solid var(--border-1);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;transition:border-color .15s;border-radius:4px}.card:hover{border-color:var(--border-2)}
.card-name{font-weight:600;font-size:.88rem;min-width:120px}
.card-meta{font-family:var(--font-mono);font-size:.75rem;padding:2px 8px;background:var(--accent-glow);color:var(--accent);border:1px solid rgba(122,157,184,.2);border-radius:2px}
.card-val{font-family:var(--font-mono);font-size:.78rem;color:var(--text-1);min-width:50px}
.badge{font-size:.72rem;padding:2px 8px;border-radius:3px;min-width:55px;text-align:center;font-weight:500}
.badge-on{background:rgba(119,153,64,.1);color:var(--green);border:1px solid rgba(119,153,64,.25)}
.badge-off{background:rgba(221,119,119,.1);color:var(--red);border:1px solid rgba(221,119,119,.25)}
.badge-unk{background:var(--bg-3);color:var(--text-2);border:1px solid var(--border-1)}
.card-actions{margin-left:auto;display:flex;gap:5px}
.btn{padding:4px 10px;font-size:.76rem;border:1px solid var(--border-2);background:transparent;color:var(--text-1);cursor:pointer;border-radius:3px;transition:all .12s}.btn:hover{border-color:var(--accent);color:var(--text-0)}
.btn-d:hover{border-color:var(--red);color:var(--red)}.btn-p{background:var(--accent);color:#fff;border-color:var(--accent)}.btn-p:hover{opacity:.9}
.empty{text-align:center;padding:36px;color:var(--text-2);font-size:.88rem}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;align-items:center;justify-content:center}.modal-bg.on{display:flex}
.modal{background:var(--bg-1);border:1px solid var(--border-2);padding:20px;width:400px;max-width:90vw;border-radius:6px}
.modal h2{font-size:.95rem;margin-bottom:12px;font-weight:600}
.fg{margin-bottom:10px}.fg label{display:block;font-size:.76rem;color:var(--text-2);margin-bottom:3px}
.fg input,.fg select{width:100%;padding:6px 9px;background:var(--bg-2);border:1px solid var(--border-1);color:var(--text-0);font-size:.83rem;border-radius:3px}.fg input:focus{outline:none;border-color:var(--accent)}
.fa{display:flex;gap:8px;margin-top:14px}
#addBtn{position:fixed;bottom:18px;right:18px;width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;font-size:1.4rem;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.3);z-index:50;border:none;cursor:pointer}#addBtn:hover{opacity:.9}
.log-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:center;justify-content:center}.log-bg.on{display:flex}
.log-box{background:var(--bg-1);border:1px solid var(--border-2);padding:14px;width:620px;max-width:90vw;max-height:70vh;display:flex;flex-direction:column;border-radius:6px}
.log-box pre{flex:1;overflow:auto;font-family:var(--font-mono);font-size:.73rem;color:var(--text-1);white-space:pre-wrap;word-break:break-all}
#loginPage{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:var(--bg-1);border:1px solid var(--border-2);padding:24px 28px;width:320px;border-radius:6px}
.login-box h1{text-align:center;margin-bottom:14px;font-size:1.05rem}
.login-box .logo{text-align:center;font-size:1.15rem;font-weight:700;color:var(--accent);margin-bottom:14px}.login-box .logo span{color:var(--text-2)}
.thm{padding:4px 8px;border:1px solid var(--border-2);background:transparent;color:var(--text-1);cursor:pointer;border-radius:3px;font-size:.72rem}.thm:hover{border-color:var(--accent);color:var(--text-0)}
</style>
</head>
<body>
<div id="loginPage">
  <div class="login-box">
    <div class="logo">deploy<span>-stack</span></div>
    <h1>Sign In</h1>
    <div class="fg"><label>Username</label><input id="iUser" placeholder="admin" autocomplete="username"></div>
    <div class="fg"><label>Password</label><input id="iPass" type="password" placeholder="password" autocomplete="current-password"></div>
    <div style="margin-top:16px"><button class="btn btn-p" style="width:100%;padding:9px;font-size:.88rem" onclick="login()">Sign In</button></div>
    <div style="text-align:center;margin-top:12px"><button class="thm" onclick="cycleTheme()">theme</button></div>
  </div>
</div>
<div id="mainPage" style="display:none">
  <nav class="nav"><div class="nav-inner">
    <div class="logo">deploy<span>-stack</span></div>
    <div class="nav-tabs">
      <div class="nav-tab active" onclick="tab('sites')">Sites</div>
      <div class="nav-tab" onclick="tab('runners')">Runners</div>
    </div>
    <div class="stats"><span>Sites: <b id="nSites">0</b></span><span>Runners: <b id="nRunners">0</b></span></div>
    <a href="/api/v1/docs" target="_blank" style="color:var(--text-1);font-size:.76rem;text-decoration:none">API</a>
    <button class="thm" onclick="cycleTheme()">theme</button>
  </div></nav>
  <div class="wrap">
    <div id="p-sites"><div id="sites"></div><div id="empty" class="empty">No sites. Click + to add one.</div></div>
    <div id="p-runners" style="display:none"><div id="runners"></div><div id="rEmpty" class="empty">No runners registered.</div></div>
  </div>
  <button id="addBtn" onclick="showModal()">+</button>
</div>
<div class="modal-bg" id="mSite"><div class="modal">
  <h2>Deploy Site</h2>
  <div class="fg"><label>Name</label><input id="fN" placeholder="mysite"></div>
  <div class="fg"><label>Directory</label><input id="fD" placeholder="/var/www/mysite"></div>
  <div class="fg"><label>Port</label><input id="fP" type="number" placeholder="auto"></div>
  <div class="fg"><label>Type</label><input id="fT" placeholder="static / php / python / node / go"></div>
  <div class="fa"><button class="btn" onclick="hideModal('mSite')">Cancel</button><button class="btn btn-p" onclick="addSite()">Deploy</button></div>
</div></div>
<div class="log-bg" id="mLog"><div class="log-box">
  <button class="btn" onclick="hideModal('mLog')" style="align-self:flex-end;margin-bottom:6px">Close</button>
  <pre id="logBody"></pre>
</div></div>
<script>
/* ── theme ── */
var TH=["dark","light","black"];
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem("ds-t",t);document.querySelectorAll(".thm").forEach(function(b){b.textContent=t})}
function cycleTheme(){var c=document.documentElement.dataset.theme||"dark";setTheme(TH[(TH.indexOf(c)+1)%TH.length])}
setTheme(localStorage.getItem("ds-t")||"dark");

/* ── auth ── */
var T=localStorage.getItem("ds-tk")||"";
function api(m,p,b){var o={method:m,headers:{"Content-Type":"application/json"}};if(T)o.headers.Authorization="Bearer "+T;if(b)o.body=JSON.stringify(b);return fetch(p,o).then(function(r){if(r.status===401){showLogin();throw 0}return r.json()})}
function login(){fetch("/api/v1/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("iUser").value,password:$("iPass").value})}).then(function(r){return r.json()}).then(function(d){if(d.token){T=d.token;localStorage.setItem("ds-tk",T);showMain()}else alert(d.error||"Error")}).catch(function(){alert("Connection error")})}
function showLogin(){$("loginPage").style.display="flex";$("mainPage").style.display="none"}
function showMain(){$("loginPage").style.display="none";$("mainPage").style.display="block";loadSites();loadRunners()}

/* ── tabs ── */
function tab(n){document.querySelectorAll(".nav-tab").forEach(function(t,i){t.classList.toggle("active",["sites","runners"][i]===n)});$("p-sites").style.display=n==="sites"?"block":"none";$("p-runners").style.display=n==="runners"?"block":"none";if(n==="sites")loadSites();if(n==="runners")loadRunners()}

/* ── sites ── */
function loadSites(){api("GET","/api/v1/sites").then(function(s){$("nSites").textContent=s.length;$("empty").style.display=s.length?"none":"block";$("sites").innerHTML=s.map(function(x){return'<div class="card"><div class="card-name">'+esc(x.name)+'</div><div class="card-meta">'+esc(x.type||"?")+'</div><div class="card-val">:'+x.port+'</div><div class="badge badge-'+(x.status==="running"?"on":"off")+'">'+esc(x.status)+'</div><div class="card-actions"><button class="btn" onclick="showLogs(\''+esc(x.name)+'\')">Logs</button><button class="btn" onclick="restart(\''+esc(x.name)+'\')">Restart</button><button class="btn btn-d" onclick="rmSite(\''+esc(x.name)+'\')">Remove</button></div></div>'}).join("")}).catch(function(){})}
function addSite(){var n=$("fN").value;if(!n)return alert("Name required");api("POST","/api/v1/sites",{name:n,dir:$("fD").value||"/var/www/"+n,port:parseInt($("fP").value)||0,type:$("fT").value}).then(function(){hideModal("mSite");setTimeout(loadSites,2000)})}
function rmSite(n){if(!confirm("Remove "+n+"?"))return;api("DELETE","/api/v1/sites/"+n+"/remove").then(function(){setTimeout(loadSites,1000)})}
function restart(n){api("POST","/api/v1/sites/"+n+"/restart").then(function(){setTimeout(loadSites,2000)})}
function showLogs(n){fetch("/api/v1/sites/"+n+"/logs",{headers:T?{Authorization:"Bearer "+T}:{}}).then(function(r){return r.text()}).then(function(t){$("logBody").textContent=t;$("mLog").classList.add("on")})}

/* ── runners ── */
function loadRunners(){api("GET","/api/v1/runners").then(function(r){$("nRunners").textContent=r?r.length:0;$("rEmpty").style.display=r&&r.length?"none":"block";$("runners").innerHTML=(r||[]).map(function(x){return'<div class="card"><div class="card-name">'+esc(x.name)+'</div><div class="card-meta">'+esc(x.image||"")+'</div><div class="badge badge-'+(x.status==="running"?"on":"off")+'">'+esc(x.status)+'</div></div>'}).join("")}).catch(function(){})}

/* ── helpers ── */
function $(id){return document.getElementById(id)}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function showModal(id){$(id).classList.add("on")}
function hideModal(id){$(id).classList.remove("on")}

/* ── init ── */
if(T)api("GET","/api/v1/status").then(function(){showMain()}).catch(function(){showLogin()});else showLogin();
</script>
</body>
</html>
