services:
  web:
    build: .
    container_name: deploy-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/www:/var/www
      - deploy-data:/data
    environment:
      - DEPLOY_ADMIN_USER=${DEPLOY_ADMIN_USER:-admin}
      - DEPLOY_ADMIN_PASS=${DEPLOY_ADMIN_PASS:-admin}

  runner:
    image: data.forgejo.org/forgejo/runner:4.0.0
    container_name: runner
    user: root
    restart: unless-stopped
    volumes:
      - /root/forgejo-runner/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/www:/var/www
      - /root/deploy-stack:/root/deploy-stack
    command: >
      sh -c "sleep 10 &&
             apk update && apk add --no-cache nodejs npm rsync &&
             ln -sf /root/deploy-stack/deploy /usr/local/bin/deploy &&
             forgejo-runner daemon --config /data/config.yaml"

volumes:
  deploy-data:
